name: Spring Boot CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Maven package
        run: mvn clean package -DskipTests # Just build the JAR for Docker to use

      - name: Start Services with Docker Compose
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          until $(curl --output /dev/null --silent --head --fail http://localhost:8080/v3/api-docs); do
            echo "Waiting for API docs..."
            sleep 5
          done

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          format: openapi
          target: 'http://localhost:8080/v3/api-docs'
          cmd_options: '-a --network="host"'

      - name: Shutdown Services
        if: always()
        run: docker compose down