

services:
  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Jarod -d financialapp"]
      interval: 5s
      retries: 10
    container_name: financial-db
    environment:
      POSTGRES_USER: Jarod
      POSTGRES_PASSWORD: Konijnenberg
      POSTGRES_DB: financialapp
    volumes:
      - pgdata:/var/lib/postgresql/pgdata
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: financial-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/financialapp
      SPRING_DATASOURCE_USERNAME: Jarod
      SPRING_DATASOURCE_PASSWORD: Konijnenberg
    ports:
      - "8080:8080"

volumes:
  pgdata:
